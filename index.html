<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> Rock Paper Scissor Game</h1>
    <div class="container">
        <div class="game">
            <div class ="choices">
                <button class="btn rock"><img src="images/rock.png" alt="Rock"></button>
                <button class="btn paper"><img src="images/paper.png" alt="Paper"> </button>
                <button class="btn scissor"><img src="images/scissors.png" alt="Scissor"></button>
            </div>
            <div class="score">
                <p> Score </p>
                <p id="playerScores"> 0 : 0</p>
            </div>
            <div class="result">
                <p> Choose your move! </p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
